[[items]]
title = "Generative Multimodal Semantic 3D-to-BIM System"
status = "Shanghai Municipal Innovation Project · Project Lead"
featured = true
year = "2025 - Present"
stack = "3DGS · Qwen-VL · SAM3 · Hierarchical Reasoning · IFC"
summary = "A semantic 3D modeling workflow for smart spaces that turns visual evidence into editable, engineering-oriented BIM structure."
highlights = [
    "Uses Qwen-VL to plan observation viewpoints and SAM3 for multi-view semantic segmentation on a 3D Gaussian Splatting geometry base.",
    "Recovers editable BIM topology through hierarchical reasoning and preserves a traceable pixel-to-Gaussian-to-mesh-to-IFC evidence chain.",
]
link = ""
linkNote = "Project documentation under review."

[[items]]
title = "EventShock Lab"
status = "UC Berkeley ENGIN 170E · Deployed Research Prototype"
featured = true
year = "2026"
stack = "Multi-Agent Simulation · FastAPI · React · TypeScript · Bounded LLM Cognition"
summary = "A bilingual counterfactual market-stress laboratory for comparing matched simulations in which exactly one declared condition changes."
highlights = [
    "Combines human-reviewed evidence, frozen event packs, deterministic multi-agent simulation, and bounded LLM-assisted cognition.",
    "Reports paired differences, uncertainty intervals, mechanism traces, and reproducibility exports without presenting synthetic paths as forecasts.",
]
link = "https://eventshock.mikezhuang.cn"
linkLabel = "Open live product"
secondaryLink = "https://github.com/Mike-Zhuang/EventShock"
secondaryLinkLabel = "View repository"

[[items]]
title = "LBM Multi-Scenario Fluid Dynamics Simulator"
status = "Open Source · Registered Software Copyright"
featured = true
year = "2026"
stack = "Python · NumPy · Matplotlib · D2Q9 LBM"
summary = "An open-source lattice Boltzmann simulation system for multi-scenario fluid evolution, vortex dynamics, parameter studies, and visual analysis."
highlights = [
    "Covers Kármán vortex streets, complex obstacles, image mazes with BFS coupling, and NACA 0012 airfoil flow.",
    "Supports interactive flow, vorticity, and lift visualization plus GIF/MP4 export; software copyright registered in May 2026.",
]
link = "https://github.com/Mike-Zhuang/LBM-Multi-Scenario-Fluid-Simulator"
linkLabel = "View repository"

