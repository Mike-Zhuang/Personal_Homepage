[[items]]
title = "EventShock Lab"
status = "UC Berkeley ENGIN 170E · Deployed Research Prototype"
featured = true
year = "2026"
stack = "Multi-Agent Simulation · FastAPI · React · TypeScript · Bounded LLM Cognition"
summary = "A bilingual counterfactual market-stress laboratory for comparing matched simulations in which exactly one declared condition changes."
